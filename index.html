<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Side Quest — NYC Campus Map</title>
<style>
:root{--g900:#0b4a31;--g700:#14663f;--g600:#1b8a5a;--g500:#2fa36f;--g200:#cde5d6;--g100:#e3f0e8;--g50:#f3f8f5;--ink:#16382a;--mute:#6b8577;--line:#dbe8e0;--ff:Helvetica,"Helvetica Neue",Arial,sans-serif;--lh:normal;--ls:-.07em}
*{box-sizing:border-box;font-family:var(--ff);line-height:var(--lh);letter-spacing:var(--ls)}
html,body{margin:0;height:100%;color:var(--ink);background:#fff}
#map{position:absolute;inset:0}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px rgba(11,74,49,.08)}
#panel{position:absolute;top:12px;left:12px;width:320px;max-height:calc(100% - 24px);display:flex;flex-direction:column;padding:16px;z-index:5}
h1{margin:0;font-size:18px;font-weight:600}h1 small{display:block;margin-top:4px;font-size:12px;font-weight:400;color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 1.3fr 1.1fr;gap:6px;margin:14px 0 10px}
select{font-size:12px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 4px;width:100%}select:focus{outline:2px solid var(--g200)}
#count,#note{font-size:11px;color:var(--mute);margin:2px 2px}
#list{overflow:auto;flex:1;min-height:80px;margin:6px -6px 10px;padding:0 6px}
.it{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font-size:13px;font-weight:500;color:var(--ink);background:transparent;border:0;border-radius:8px;padding:8px;cursor:pointer}
.it:hover{background:var(--g50)}.it.on{background:var(--g100)}.it i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--g600)}
.it span{display:block;font-size:11px;font-weight:400;color:var(--mute);margin-top:2px}
#layers{border-top:1px solid var(--line);padding-top:10px;font-size:12px}#layers h3{margin:0 0 6px;font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase}
#layers label{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}#layers .sw{width:10px;height:10px;border-radius:3px}
#layers input{accent-color:var(--g600);margin:0}
#home{position:absolute;right:12px;bottom:36px;z-index:5;font-size:12px;font-weight:600;color:var(--g700);padding:8px 12px;cursor:pointer}
#card{position:absolute;top:12px;right:12px;width:280px;z-index:6;padding:16px;display:none}
#card h2{margin:0 24px 8px 0;font-size:16px;font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tags span{font-size:11px;font-weight:600;color:var(--g700);background:var(--g100);border-radius:6px;padding:3px 8px}
#card p{margin:6px 0;font-size:12px;color:var(--mute)}#card p b{color:var(--ink);font-weight:600}
#card a{display:inline-block;margin-top:10px;background:var(--g600);color:#fff;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;text-decoration:none}#card a:hover{background:var(--g700)}
#x{position:absolute;top:10px;right:10px;background:none;border:0;font-size:14px;color:var(--mute);cursor:pointer}
#err{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,90%);padding:18px;z-index:9;font-size:13px}
.bl{font-size:12px;font-weight:600;color:#5f8a73;text-transform:uppercase;pointer-events:none;transition:opacity .4s}
.cl{display:none;font-size:11px;font-weight:600;color:var(--g900);text-align:center;max-width:120px;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none}body.lz .cl{display:block}body.nolbl .cl,.cl.off{display:none!important}
.tip .maplibregl-popup-content{background:var(--g900);color:#fff;border-radius:6px;font-family:var(--ff)!important;line-height:var(--lh)!important;font-size:12px;font-weight:600;padding:5px 9px;box-shadow:none}
.tip.maplibregl-popup-anchor-bottom .maplibregl-popup-tip{border-top-color:var(--g900)}
.maplibregl-ctrl-group{border:1px solid var(--line);border-radius:8px!important;box-shadow:none!important;background:#fff}
@media(max-width:700px){#panel{top:auto;bottom:0;left:0;right:0;width:100%;max-height:42%;border-radius:14px 14px 0 0}#card{top:8px;left:8px;right:8px;width:auto}#home{bottom:44%}.maplibregl-ctrl-bottom-right{display:none}}

.brand{display:flex;align-items:center;gap:12px;margin-bottom:3px}
.brand img{width:48px;height:48px;object-fit:contain;flex:none}
.brand h1{font-size:21px;letter-spacing:-.04em}
.brand h1 small{letter-spacing:0;line-height:1.35}
#panel{transition:height .2s ease}
#home{touch-action:manipulation}
@media(max-width:700px){
 html,body{height:100%;height:100dvh;overflow:hidden}
 #panel{bottom:0;top:auto;left:0;right:0;width:100%;max-height:55dvh;min-height:190px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;overflow:hidden}
 .brand{gap:10px}.brand img{width:42px;height:42px}
 .brand h1{font-size:19px}
 .row{grid-template-columns:1fr 1fr 1fr;gap:7px;margin:12px 0 8px}
 select{font-size:13px;min-height:38px;padding:8px 6px}
 #count,#note{font-size:11px;line-height:1.35}
 #list{min-height:64px;max-height:24dvh;margin:6px -5px 8px;padding:0 5px}
 .it{padding:10px 8px;min-height:44px;font-size:13px}
 #layers{padding-top:8px}
 #layers label{min-height:30px}
 #home{bottom:calc(57dvh + 12px);right:12px;padding:10px 12px}
 #card{top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;width:auto;max-height:45dvh;overflow:auto;padding:18px}
 .maplibregl-ctrl-bottom-right{display:none}
 .maplibregl-ctrl-top-right{top:env(safe-area-inset-top)}
}
@media(max-width:390px){
 #panel{max-height:58dvh;padding-left:12px;padding-right:12px}
 .row{gap:5px}
 select{font-size:11px}
 #home{bottom:calc(60dvh + 8px)}
}
</style></head><body>
<div id="map"></div>
<div id="panel" class="card">
 <div class="brand"><img src="LOGO.png" alt="Side Quest logo"><div><h1>Side Quest<small>Invite Pending...</small></h1></div></div>
 <div class="row"><select id="fb" aria-label="Borough"></select><select id="ft" aria-label="Type"></select><select id="fc" aria-label="Public or private"></select></div>
 <div id="count"></div><div id="note"></div><div id="list"></div>
 <div id="layers"><h3>Layers</h3><div id="layerlist"></div></div>
</div>
<button id="home" class="card">Reset view</button>
<div id="card" class="card"><button id="x" aria-label="Close">✕</button><div id="cb"></div></div>
<div id="err" class="card"></div>
<script src="colleges.js"></script>
<script>
/* Load MapLibre from the first CDN that works, then start the app */
const CDN=['https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/','https://unpkg.com/maplibre-gl@4.7.1/dist/','https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/'];
function loadLib(i){
 if(i>=CDN.length){boot();return}
 const l=document.createElement('link');l.rel='stylesheet';l.href=CDN[i]+'maplibre-gl.css';document.head.appendChild(l);
 const s=document.createElement('script');s.src=CDN[i]+'maplibre-gl.js';s.onload=boot;s.onerror=()=>{l.remove();loadLib(i+1)};document.head.appendChild(s)}
function boot(){
/* ---------- DATA LAYER (reads colleges.js) ---------- */
const $=id=>document.getElementById(id),fail=m=>{const e=$('err');e.style.display='block';e.innerHTML=m;console.error(m)};
if(!window.NYC_COLLEGES)fail('<b>colleges.js</b> was not found next to this page, so no campuses could load.');
const D=(window.NYC_COLLEGES||[]).map((r,i)=>({id:i,name:r[0],boro:r[1],addr:r[2]+', '+r[1]+', NY',lat:r[3],lng:r[4],url:'https://'+r[5],type:r[6],ctl:r[7]}));
const TYPES=['University','College','Community college','Arts & design','Medical & research','Specialized'],HOME={center:[-73.96,40.72],zoom:10.3},NONE=['==',['get','id'],-1],GREEN='#1b8a5a';
const FC=f=>({type:'FeatureCollection',features:f});
const pts=(l,has)=>FC(l.map(d=>({type:'Feature',properties:{id:d.id,name:d.name,poly:has.has(d.id)},geometry:{type:'Point',coordinates:[d.lng,d.lat]}})));

/* ---------- CAMPUS BOUNDARIES: real OpenStreetMap polygons (amenity=university|college), matched to the dataset ---------- */
const OQ='[out:json][timeout:90];(way["amenity"~"^(university|college)$"](40.49,-74.27,40.92,-73.69);relation["amenity"~"^(university|college)$"](40.49,-74.27,40.92,-73.69););out geom;';
const eq=(a,b)=>a[0]===b[0]&&a[1]===b[1],rd=c=>typeof c[0]==='number'?[+c[0].toFixed(5),+c[1].toFixed(5)]:c.map(rd);
function join(segs){const out=[];segs=segs.map(s=>s.slice());while(segs.length){let r=segs.pop(),go=true;while(go&&!eq(r[0],r[r.length-1])){go=false;for(let i=0;i<segs.length;i++){const s=segs[i];if(eq(s[0],r[r.length-1]))r=r.concat(s.slice(1));else if(eq(s[s.length-1],r[r.length-1]))r=r.concat(s.slice(0,-1).reverse());else if(eq(s[s.length-1],r[0]))r=s.concat(r.slice(1));else if(eq(s[0],r[0]))r=s.slice(1).reverse().concat(r);else continue;segs.splice(i,1);go=true;break}}if(r.length>=4&&eq(r[0],r[r.length-1]))out.push(r)}return out}
function toFeatures(j){const out=[];for(const e of j.elements){const t=e.tags||{},names=[t.name,t.official_name,t.alt_name,t.short_name].filter(Boolean).join(';').split(';');let g=null;
 if(e.type==='way'&&e.geometry){const r=e.geometry.map(p=>[p.lon,p.lat]);if(r.length>=4&&eq(r[0],r[r.length-1]))g={type:'Polygon',coordinates:[r]}}
 else if(e.type==='relation'&&e.members){const rs=join(e.members.filter(m=>m.type==='way'&&m.geometry&&m.role!=='inner').map(m=>m.geometry.map(p=>[p.lon,p.lat])));if(rs.length)g={type:'MultiPolygon',coordinates:rs.map(r=>[r])}}
 if(g){g.coordinates=rd(g.coordinates);out.push({type:'Feature',properties:{names},geometry:g})}}return out}
async function loadBounds(){
 try{const c=JSON.parse(localStorage.getItem('campusBounds-v1')||'null');if(c&&c.length)return c}catch(e){}
 for(const u of['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){try{const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(OQ)});if(!r.ok)continue;const f=toFeatures(await r.json());if(f.length){try{localStorage.setItem('campusBounds-v1',JSON.stringify(f))}catch(e){}return f}}catch(e){}}
 return null}
const norm=s=>(s||'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/&/g,' and ').replace(/[^a-z0-9 ]/g,' ').replace(/\b(the|of|at|new york city|cuny|suny|campus)\b/g,' ').replace(/\s+/g,' ').trim(),DN=D.map(d=>norm(d.name));
const ringsOf=g=>g.type==='Polygon'?[g.coordinates[0]]:g.coordinates.map(p=>p[0]);
function inside(pt,ring){let c=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const a=ring[i],b=ring[j];if((a[1]>pt[1])!==(b[1]>pt[1])&&pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function matchId(f){ // 1) name match within 6 km of the listed campus, 2) polygon contains the campus coordinates
 const rs=ringsOf(f.geometry),r0=rs[0];let sx=0,sy=0;r0.forEach(p=>{sx+=p[0];sy+=p[1]});const mx=sx/r0.length,my=sy/r0.length,nn=f.properties.names.map(norm).filter(Boolean);let best=-1,bl=0;
 D.forEach((d,i)=>{const dx=(mx-d.lng)*84300,dy=(my-d.lat)*110540;if(dx*dx+dy*dy>36e6)return;const ni=DN[i];if(ni&&nn.some(n=>n===ni||n.includes(ni)||(ni.includes(n)&&n.length>=8))&&ni.length>bl){best=i;bl=ni.length}});
 if(best>=0)return best;for(const d of D)if(rs.some(r=>inside([d.lng,d.lat],r)))return d.id;return -1}

let map=null,ready=false,sel=null,camp=[],has=new Set(),LBL=[];const queue=[];

/* ---------- LAYER REGISTRY (toggle panel + API for layering your own data) ---------- */
const LAYERS=[{id:'campuses',name:'Campuses',ids:['camp','campsel','dotsel','dotp','dotn'],on:true,color:GREEN}];
function renderLayers(){$('layerlist').innerHTML=LAYERS.map(l=>`<label><input type="checkbox" data-l="${l.id}" ${l.on?'checked':''}><span class="sw" style="background:${l.color||'#7cc9a0'}"></span>${l.name}</label>`).join('')}
$('layerlist').addEventListener('change',e=>{const l=LAYERS.find(x=>x.id===e.target.dataset.l);if(!l)return;l.on=e.target.checked;if(map)l.ids.forEach(i=>map.getLayer(i)&&map.setLayoutProperty(i,'visibility',l.on?'visible':'none'));if(l.id==='campuses')document.body.classList.toggle('nolbl',!l.on)});
const DEF={circle:{'circle-radius':5,'circle-color':'#7cc9a0','circle-stroke-color':'#ffffff','circle-stroke-width':1},fill:{'fill-color':'#7cc9a0','fill-opacity':.6},line:{'line-color':'#2fa36f','line-width':1.5}};
/* window.CampusMap.addLayer({id,name,type:'circle'|'fill'|'line',data:<GeoJSON>,paint,filter,color,before}) */
window.CampusMap={campuses:D,get map(){return map},whenReady(fn){ready?fn(map):queue.push(fn)},
 addLayer(o){this.whenReady(m=>{const type=o.type||'circle';m.addSource(o.id,{type:'geojson',data:o.data});m.addLayer({id:o.id,type,source:o.id,paint:{...DEF[type],...(o.paint||{})},layout:o.layout||{},...(o.filter?{filter:o.filter}:{})},o.before);LAYERS.push({id:o.id,name:o.name||o.id,ids:[o.id],on:true,color:o.color||(o.paint&&(o.paint['circle-color']||o.paint['fill-color']||o.paint['line-color']))});renderLayers()})}};

/* ---------- INTERFACE LAYER (runs first, so the panel works even if the map can't start) ---------- */
const opts=(el,all,list)=>el.innerHTML=`<option value="">${all}</option>`+list.map(v=>`<option>${v}</option>`).join('');
opts($('fb'),'Borough',['Manhattan','Brooklyn','Queens','Bronx','Staten Island']);opts($('ft'),'Type',TYPES);opts($('fc'),'Public/Private',['Public','Private']);renderLayers();
function render(){
 const b=$('fb').value,t=$('ft').value,c=$('fc').value,L=D.filter(d=>(!b||d.boro===b)&&(!t||d.type===t)&&(!c||d.ctl===c)),ids=new Set(L.map(d=>d.id));
 if(map&&map.getSource('campus')){map.getSource('campus').setData(FC(camp.filter(f=>ids.has(f.properties.id))));map.getSource('pts').setData(pts(L,has))}
 LBL.forEach((e,i)=>e.classList.toggle('off',!ids.has(i)));
 if(sel!=null&&!ids.has(sel)){select(null);return}
 $('count').textContent=`${L.length} of ${D.length} campuses`;
 $('list').innerHTML=L.map(d=>`<button class="it${d.id===sel?' on':''}" data-id="${d.id}"><i></i><div>${d.name}<span>${d.boro} · ${d.type} · ${d.ctl}</span></div></button>`).join('')||'<p style="font-size:12px;color:var(--mute);padding:8px">No campuses match these filters.</p>';
}
['fb','ft','fc'].forEach(i=>$(i).addEventListener('input',render));
$('list').addEventListener('click',e=>{const b=e.target.closest('.it');if(b)select(+b.dataset.id,true)});
function select(id,fly){
 sel=id;const f=id==null?NONE:['==',['get','id'],id];if(map)['campsel','dotsel'].forEach(l=>map.getLayer(l)&&map.setFilter(l,f));
 const card=$('card');if(id==null){card.style.display='none';render();return}
 const d=D[id];$('cb').innerHTML=`<h2>${d.name}</h2><div class="tags"><span>${d.type}</span><span>${d.ctl}</span></div><p><b>Borough</b> ${d.boro}</p><p><b>Address</b> ${d.addr}</p><a href="${d.url}" target="_blank" rel="noopener">Official website ↗</a>`;
 card.style.display='block';render();
 if(fly&&map)map.flyTo({center:[d.lng,d.lat],zoom:Math.max(map.getZoom(),15),speed:.9});
}
$('x').onclick=()=>select(null);$('home').onclick=()=>{select(null);if(map)map.flyTo({...HOME})};
render();

/* ---------- GEOGRAPHIC LAYER: white-to-green basemap (OpenFreeMap vector tiles) ---------- */
function startMap(){
const road=(id,cls,w,minz)=>({id,type:'line',source:'o','source-layer':'transportation',minzoom:minz,filter:['in',['get','class'],['literal',cls]],layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#ffffff','line-width':['interpolate',['exponential',1.5],['zoom'],10,w*.35,16,w*3]}});
const bf=['all',['>=',['get','admin_level'],6],['<=',['get','admin_level'],7]];
const style={version:8,sources:{o:{type:'vector',url:'https://tiles.openfreemap.org/planet',attribution:'OpenFreeMap © OpenMapTiles, data © OpenStreetMap'}},layers:[
{id:'bg',type:'background',paint:{'background-color':'#e9f2ec'}},
{id:'park',type:'fill',source:'o','source-layer':'park',paint:{'fill-color':'#cde5d6'}},
{id:'water',type:'fill',source:'o','source-layer':'water',paint:{'fill-color':'#ffffff'}},
{id:'bldg',type:'fill',source:'o','source-layer':'building',minzoom:15,paint:{'fill-color':'#f6faf7','fill-outline-color':'#dbe8e0'}},
road('minor',['minor','service'],1.1,14),road('major',['tertiary','secondary','primary','trunk','motorway'],2.2,10.5),
{id:'boroc',type:'line',source:'o','source-layer':'boundary',filter:bf,paint:{'line-color':'#a9cdb8','line-width':4,'line-opacity':.5,'line-blur':2}},
{id:'boro',type:'line',source:'o','source-layer':'boundary',filter:bf,layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#ffffff','line-width':['interpolate',['linear'],['zoom'],9,1.2,14,2.5]}}]};
map=new maplibregl.Map({container:'map',style,...HOME,minZoom:9,maxZoom:18,maxBounds:[[-74.6,40.4],[-73.5,41.05]],attributionControl:{compact:true}});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
[['Manhattan',-73.99,40.78],['Brooklyn',-73.95,40.645],['Queens',-73.82,40.705],['The Bronx',-73.865,40.85],['Staten Island',-74.15,40.58]].forEach(([n,x,y])=>{const e=document.createElement('div');e.className='bl';e.textContent=n;new maplibregl.Marker({element:e}).setLngLat([x,y]).addTo(map)});
LBL=D.map(d=>{const e=document.createElement('div');e.className='cl';e.textContent=d.name;new maplibregl.Marker({element:e,anchor:'top',offset:[0,8]}).setLngLat([d.lng,d.lat]).addTo(map);return e});
map.on('zoom',()=>{const z=map.getZoom();document.querySelectorAll('.bl').forEach(e=>e.style.opacity=z>12.3?0:1);document.body.classList.toggle('lz',z>12.5)});

/* ---------- INSTITUTION LAYER: campuses as solid green sections (real boundaries, no outlines) ---------- */
const pop=new maplibregl.Popup({closeButton:false,closeOnClick:false,offset:10,className:'tip'});
map.on('load',()=>{
 map.addSource('campus',{type:'geojson',data:FC([])});map.addSource('pts',{type:'geojson',data:pts(D,has)});
 map.addLayer({id:'camp',type:'fill',source:'campus',paint:{'fill-color':GREEN,'fill-opacity':.9,'fill-antialias':false}},'bldg');
 map.addLayer({id:'campsel',type:'fill',source:'campus',filter:NONE,paint:{'fill-color':'#0b4a31','fill-opacity':.7,'fill-antialias':false}},'bldg');
 map.addLayer({id:'dotsel',type:'circle',source:'pts',filter:NONE,paint:{'circle-radius':14,'circle-color':GREEN,'circle-opacity':.2}});
 const dot=(id,filter,rad,op)=>map.addLayer({id,type:'circle',source:'pts',filter,paint:{'circle-radius':rad,'circle-color':GREEN,'circle-stroke-color':'#ffffff','circle-stroke-width':1.5,'circle-opacity':op,'circle-stroke-opacity':op}});
 dot('dotp',['==',['get','poly'],true],['interpolate',['linear'],['zoom'],9,4,12,6,13.5,0],['interpolate',['linear'],['zoom'],12,1,13.5,0]); // dot fades as the real shape appears
 dot('dotn',['!=',['get','poly'],true],['interpolate',['linear'],['zoom'],9,4,12,6,16,8],1); // no boundary found: keep a marker
 const hit=e=>map.queryRenderedFeatures(e.point,{layers:['camp','dotp','dotn']})[0];
 map.on('mousemove',e=>{const f=hit(e);if(f){map.getCanvas().style.cursor='pointer';pop.setLngLat(e.lngLat).setText(f.properties.name).addTo(map)}else{map.getCanvas().style.cursor='';pop.remove()}});
 map.on('click',e=>{const f=hit(e);select(f?f.properties.id:null,!!f)});
 ready=true;queue.splice(0).forEach(fn=>fn(map));
 $('note').textContent='Loading campus boundaries…';
 loadBounds().then(feats=>{
  if(!feats){$('note').textContent='Campus boundaries could not be loaded — showing markers only.';return}
  camp=[];has=new Set();feats.forEach(f=>{const id=matchId(f);if(id>=0){has.add(id);camp.push({type:'Feature',properties:{id,name:D[id].name},geometry:f.geometry})}});
  $('note').textContent=`Boundaries found for ${has.size} of ${D.length} campuses; the rest show as markers.`;render()});
 render();
});
map.on('error',e=>{const m=String(e&&e.error&&e.error.message||'');console.warn('map error',m);if(/fetch|network|openfreemap|load/i.test(m))$('note').textContent='Map data could not be loaded from the tile server — check your connection or ad blocker.'});
}
try{
 if(typeof maplibregl==='undefined')throw new Error('nolib');
 startMap();
